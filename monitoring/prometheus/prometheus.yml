global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Alerting rules (tests in tests/, make check). Firing alerts go to
# Alertmanager, which e-mails them.
rule_files:
  - rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

# Every target is listed even when its service does not run (a profile is off or
# the service does not serve /metrics yet). Such a target is `down` on the
# Targets page, that is not an error of the configuration.
scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Network services. The devnet: instance="node-1" instead of "node-1:9100"
  # in Grafana and the alerts
  - job_name: pouw-node
    static_configs:
      - targets: ["node-1:9100", "node-2:9100", "node-3:9100"]
    relabel_configs:
      - source_labels: [__address__]
        regex: '(.+):\d+'
        target_label: instance
  - job_name: pouw-indexer
    static_configs:
      - targets: ["indexer:8000"]
  - job_name: pouw-workload
    static_configs:
      - targets: ["workload:8001"]
  - job_name: pouw-light-node
    static_configs:
      - targets: ["light-node:8000"]

  # The server and its containers (profile `host-metrics`)
  - job_name: node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: cadvisor
    static_configs:
      - targets: ["cadvisor:8080"]
