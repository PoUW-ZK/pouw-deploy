name: pouw

# Profiles (COMPOSE_PROFILES in .env):
#   no profile   network services (Postgres, Hasura) and monitoring (Prometheus, Grafana)
#   jenkins      Jenkins controller, agent and an isolated Docker for tests
#   proxy        Caddy with HTTPS for Jenkins and Grafana (server only)
#   host-metrics node-exporter (the server) and cAdvisor (its containers) for Prometheus
#   network      services without an image in GHCR yet (dashboard)
#                (`make dev` builds them from your working copies and adds this profile)
#
# Ports are published only on 127.0.0.1. On the FIIT server the range
# 8000-10000 is open from outside and Docker bypasses ufw, so 0.0.0.0 would
# expose the service. From outside, access goes only through the proxy on 80/443.
#
# Secrets go into containers as files in /run/secrets/, never via environment.
# They are prepared by `make secrets` (random locally, from pass on the server).

x-restart: &restart
  restart: unless-stopped

# Healthcheck of the network services: each serves /health on port 8000
# (pouw-node#63, pouw-indexer#24, pouw-workload#26), its image must contain curl
x-health: &health
  test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/health"]
  interval: 10s
  timeout: 5s
  start_period: 30s
  retries: 10

services:
  prometheus:
    <<: *restart
    image: quay.io/prometheus/prometheus:${PROMETHEUS_VERSION:-v3.0.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    <<: *restart
    image: grafana/grafana:${GRAFANA_VERSION:-11.3.0}
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3000/}
    secrets:
      - grafana_admin_password
      # Postgres datasource (monitoring/grafana/provisioning/datasources/postgres.yml)
      - grafana_db_password
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      grafana-db-user:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Metrics of the machine. On Docker Desktop (macOS, Windows) the machine is
  # Docker's Linux VM, not the laptop. No ports, only Prometheus reads it.
  node-exporter:
    <<: *restart
    profiles: [host-metrics]
    image: quay.io/prometheus/node-exporter:${NODE_EXPORTER_VERSION:-v1.12.1}
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro

  # Metrics of every container on the machine. It finds the containers through
  # the Docker and containerd sockets, which Docker Desktop maps to its VM; a
  # mount of the whole /var/run would be the laptop's directory on macOS.
  cadvisor:
    <<: *restart
    profiles: [host-metrics]
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION:-v0.55.1}
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  # Database of the indexer. No ports: 5432 is open from outside on the FIIT firewall.
  postgres:
    <<: *restart
    image: postgres:${POSTGRES_VERSION:-16}
    environment:
      POSTGRES_USER: pouw
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: pouw
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pouw", "-d", "pouw"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Read-only user `grafana` in the indexer database (ADR-0008). Runs on every
  # start, creates or updates the user and its password, then exits.
  grafana-db-user:
    image: postgres:${POSTGRES_VERSION:-16}
    entrypoint:
      - /bin/sh
      - -c
      - |
        PGPASSWORD="$$(cat /run/secrets/postgres_password)" exec psql -h postgres -U pouw -d pouw \
          -v ON_ERROR_STOP=1 -q -v pw="$$(cat /run/secrets/grafana_db_password)" -f /grafana-reader.sql
    secrets:
      - postgres_password
      - grafana_db_password
    volumes:
      - ./monitoring/postgres/grafana-reader.sql:/grafana-reader.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  # GraphQL API of the explorer over the indexer database. The image comes from
  # pouw-dashboard/hasura and applies its metadata on start; with metadata that
  # does not match the schema it does not start. The metadata tracks the views
  # in the schema api, which the indexer creates (its migrations), so Hasura
  # starts after the indexer.
  hasura:
    <<: *restart
    image: ghcr.io/pouw-zk/pouw-dashboard-hasura:${DASHBOARD_HASURA_VERSION:-main}
    # Hasura reads the admin secret and the database URL only from the
    # environment, so they are loaded from /run/secrets just before the start
    entrypoint:
      - /bin/sh
      - -c
      - |
        export HASURA_GRAPHQL_ADMIN_SECRET="$$(cat /run/secrets/hasura_admin_secret)"
        export PG_DATABASE_URL="postgres://pouw:$$(cat /run/secrets/postgres_password)@postgres:5432/pouw"
        export HASURA_GRAPHQL_METADATA_DATABASE_URL="$$PG_DATABASE_URL"
        exec docker-entrypoint.sh "$$HGE_BINARY" serve
    environment:
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      # Requests without a token (the explorer) get the read-only role of the
      # metadata. The image sets it too (pouw-dashboard#95), this covers older images.
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
    secrets:
      - postgres_password
      - hasura_admin_secret
    ports:
      - "127.0.0.1:${HASURA_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      # The indexer creates the tables and the api views that the metadata
      # tracks. Not required, so a build without an indexer image
      # (build/skip.yml) still parses; Hasura is then switched off too.
      indexer:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 1m
      retries: 10

  # Services of the network, from GHCR (docker.yml of each repository). A new
  # service without an image yet goes into the `network` profile, so `make up`,
  # the nightly test and staging do not fail on pull; once its image exists,
  # delete its `profiles` line.
  # Variables marked TODO are not agreed with the owner yet.

  # Variables: pouw-node/README.md. The store stays in memory (POUW_STORE)
  # until the RocksDB backend exists (pouw-node#69); /data holds the node key.
  node-1:
    <<: *restart
    image: ghcr.io/pouw-zk/pouw-node:${NODE_VERSION:-main}
    environment:
      POUW_NODE_ID: node-1
      POUW_DATA_DIR: /data
    volumes:
      - node-1-data:/data
    # TODO pouw-node#59: the node has no REST API yet, so /health is not served
    # and healthy only means the process runs. Then: healthcheck: *health
    healthcheck:
      <<: *health
      test: ["CMD-SHELL", "kill -0 1"]

  indexer:
    <<: *restart
    image: ghcr.io/pouw-zk/pouw-indexer:${INDEXER_VERSION:-main}
    # The indexer reads the database only from DATABASE_URL, so the URL is put
    # together from /run/secrets just before the start, as for Hasura. It runs
    # its migrations on start. Fixture blocks: make seed
    entrypoint:
      - /bin/sh
      - -c
      - |
        export DATABASE_URL="postgres://pouw:$$(cat /run/secrets/postgres_password)@postgres:5432/pouw"
        exec pouw-indexer "$$@"
      - pouw-indexer
    command: [serve]
    environment:
      # TODO @NotGeorgeLucas: variable name, the indexer does not read the node yet
      NODE_URL: http://node-1:8000
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${INDEXER_PORT:-8083}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      node-1:
        condition: service_healthy
    healthcheck: *health

  workload:
    <<: *restart
    image: ghcr.io/pouw-zk/pouw-workload:${WORKLOAD_VERSION:-main}
    # Until the light node runs (W5, pouw-node#101) this points to the full node
    environment:
      LIGHT_NODE_URL: http://node-1:8000
    depends_on:
      node-1:
        condition: service_healthy
    healthcheck: *health

  # Explorer UI, nginx on port 8080 (pouw-dashboard/web)
  dashboard:
    <<: *restart
    profiles: [network]
    image: ghcr.io/pouw-zk/pouw-dashboard:${DASHBOARD_VERSION:-main}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8082}:8080"
    depends_on:
      hasura:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10

  jenkins:
    <<: *restart
    profiles: [jenkins]
    build: ./jenkins
    image: pouw-jenkins:local
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      # jenkins.yaml is shared, the second file sets the login (github or local)
      CASC_JENKINS_CONFIG: /var/jenkins_casc/jenkins.yaml,/var/jenkins_casc/${JENKINS_AUTH:-local}.yaml
      JENKINS_PUBLIC_URL: ${JENKINS_URL:-http://localhost:8080/}
      JENKINS_ADMINS: ${JENKINS_ADMINS:-Faustynn}
      # pouw-deploy branch for the local job (JENKINS_AUTH=local)
      JENKINS_LOCAL_BRANCH: ${JENKINS_LOCAL_BRANCH:-main}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-jenkins@localhost}
    secrets:
      - jenkins_admin_password
      - jenkins_agent_ssh_key
      - github_oauth_client_id
      - github_oauth_client_secret
      - github_app_id
      - github_app_key
      - github_webhook_secret
      - smtp_username
      - smtp_password
    volumes:
      - ./jenkins/casc:/var/jenkins_casc:ro
      - jenkins-home:/var/jenkins_home
    ports:
      - "127.0.0.1:${JENKINS_PORT:-8080}:8080"
    networks: [default, jenkins]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/login"]
      interval: 15s
      timeout: 5s
      start_period: 3m
      retries: 10

  # Agent that runs all jobs (the controller has 0 executors).
  # Docker commands from jobs go to jenkins-docker, not to the server's Docker,
  # so a job cannot reach the secrets or the network's containers.
  jenkins-agent:
    <<: *restart
    profiles: [jenkins]
    build:
      context: ./jenkins
      dockerfile: agent.Dockerfile
    image: pouw-jenkins-agent:local
    entrypoint: ["/bin/sh", "-c", "exec setup-sshd \"$$(cat /run/secrets/jenkins_agent_ssh_pubkey)\""]
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    secrets:
      - jenkins_agent_ssh_pubkey
    volumes:
      - jenkins-docker-certs:/certs/client:ro
      - jenkins-agent-work:/home/jenkins/agent
    networks: [jenkins]
    depends_on:
      jenkins-docker:
        condition: service_healthy

  jenkins-docker:
    <<: *restart
    profiles: [jenkins]
    image: docker:dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-docker-data:/var/lib/docker
      - jenkins-agent-work:/home/jenkins/agent
    networks:
      jenkins:
        # The TLS certificate from docker:dind is issued for the name "docker"
        aliases: [docker]
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 10

  proxy:
    <<: *restart
    profiles: [proxy]
    image: caddy:2
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
      JENKINS_HOST: ${JENKINS_HOST:-jenkins.localhost}
      GRAFANA_HOST: ${GRAFANA_HOST:-grafana.localhost}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"

networks:
  default:
  jenkins:

secrets:
  grafana_admin_password:
    file: ${SECRETS_DIR:-./.secrets}/grafana_admin_password
  postgres_password:
    file: ${SECRETS_DIR:-./.secrets}/postgres_password
  grafana_db_password:
    file: ${SECRETS_DIR:-./.secrets}/grafana_db_password
  hasura_admin_secret:
    file: ${SECRETS_DIR:-./.secrets}/hasura_admin_secret
  jenkins_admin_password:
    file: ${SECRETS_DIR:-./.secrets}/jenkins_admin_password
  jenkins_agent_ssh_key:
    file: ${SECRETS_DIR:-./.secrets}/jenkins_agent_ssh_key
  jenkins_agent_ssh_pubkey:
    file: ${SECRETS_DIR:-./.secrets}/jenkins_agent_ssh_key.pub
  github_oauth_client_id:
    file: ${SECRETS_DIR:-./.secrets}/github_oauth_client_id
  github_oauth_client_secret:
    file: ${SECRETS_DIR:-./.secrets}/github_oauth_client_secret
  github_app_id:
    file: ${SECRETS_DIR:-./.secrets}/github_app_id
  github_app_key:
    file: ${SECRETS_DIR:-./.secrets}/github_app_key
  github_webhook_secret:
    file: ${SECRETS_DIR:-./.secrets}/github_webhook_secret
  smtp_username:
    file: ${SECRETS_DIR:-./.secrets}/smtp_username
  smtp_password:
    file: ${SECRETS_DIR:-./.secrets}/smtp_password

volumes:
  prometheus-data:
  grafana-data:
  postgres-data:
  node-1-data:
  jenkins-home:
  jenkins-agent-work:
  jenkins-docker-certs:
  jenkins-docker-data:
  caddy-data:
  caddy-config:
