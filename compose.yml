name: pouw

# Profiles (COMPOSE_PROFILES in .env):
#   no profile   the network (the devnet of node-1..3, Postgres, indexer, Hasura,
#                workload, the explorer), monitoring (Prometheus, Alertmanager,
#                Grafana) and the nightly backup
#   jenkins      Jenkins controller, agent and an isolated Docker for tests
#   proxy        Caddy with HTTPS for Jenkins, Grafana and the explorer (server only)
#   host-metrics node-exporter (the server) and cAdvisor (its containers) for Prometheus
#   network      services without an image in GHCR yet (none right now)
#                (`make dev` builds them from your working copies and adds this profile)
#
# Ports are published only on 127.0.0.1. On the FIIT server the range
# 8000-10000 is open from outside and Docker bypasses ufw, so 0.0.0.0 would
# expose the service. From outside, access goes only through the proxy on 80/443.
#
# Secrets go into containers as files in /run/secrets/, never via environment.
# They are prepared by `make secrets` (random locally, from pass on the server).

x-restart: &restart
  restart: unless-stopped

# Docker keeps the log of a container in a file that grows without a limit.
# Here at most 3 files of 10 MB per container, the oldest is deleted, so logs
# never fill the disk. Viewing: make logs SERVICE=<service>
x-logging: &logging
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

# Healthcheck of the network services: each serves /health on port 8000
# (pouw-node#63, pouw-indexer#24, pouw-workload#26), its image must contain curl
x-health: &health
  test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/health"]
  interval: 10s
  timeout: 5s
  start_period: 30s
  retries: 10

# Nodes of the devnet (node-1..3), variables: pouw-node/README.md. Each node
# has its own volume (RocksDB and the node key) and reads the chain spec that
# the service genesis made for this devnet. node-1 is the bootnode and the only
# miner; node-2 and node-3 dial it (NODE_BOOTNODES) and find each other through it.
x-node: &node
  <<: [*restart, *logging]
  image: ghcr.io/pouw-zk/pouw-node:${NODE_VERSION:-main}
  depends_on:
    genesis:
      condition: service_completed_successfully
  healthcheck: *health

x-node-env: &node-env
  POUW_CHAIN_SPEC: /devnet/chainspec.json
  POUW_DATA_DIR: /data
  POUW_STORE: rocksdb

services:
  prometheus:
    <<: [*restart, *logging]
    image: quay.io/prometheus/prometheus:${PROMETHEUS_VERSION:-v3.0.0}
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      # Links in the alert e-mails; on the server through an SSH tunnel
      - --web.external-url=http://localhost:9090
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  # E-mails the alerts of Prometheus (monitoring/prometheus/rules) through the
  # SMTP account of Jenkins to ALERT_EMAIL. Without SMTP_HOST or ALERT_EMAIL
  # it only lists them on http://localhost:9093. Test: make test-alert
  alertmanager:
    <<: [*restart, *logging]
    image: quay.io/prometheus/alertmanager:${ALERTMANAGER_VERSION:-v0.35.0}
    entrypoint: ["/bin/sh", "/etc/alertmanager/run.sh"]
    environment:
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-alertmanager@localhost}
      ALERT_EMAIL: ${ALERT_EMAIL:-}
    secrets:
      - smtp_username
      - smtp_password
    volumes:
      - ./monitoring/alertmanager:/etc/alertmanager:ro
      # Silences and what was already sent survive a restart
      - alertmanager-data:/alertmanager
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-9093}:9093"
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:9093/-/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  grafana:
    <<: [*restart, *logging]
    image: grafana/grafana:${GRAFANA_VERSION:-11.3.0}
    # setup.sh needs the running API. It is not a service of its own because
    # `up --wait` fails on a one-shot container nothing depends on.
    entrypoint:
      - /bin/sh
      - -c
      - |
        /bin/sh /public-org/setup.sh &
        exec /run.sh
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_URL:-http://localhost:3000/}
      # Panels embedded in the explorer, without a login. Anonymous visitors are
      # Viewers of the organization Public only (monitoring/grafana/public-org).
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_NAME: Public
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_AUTH_ANONYMOUS_HIDE_VERSION: "true"
      GF_SECURITY_ALLOW_EMBEDDING: "true"
    secrets:
      - grafana_admin_password
      # Postgres datasource (monitoring/grafana/provisioning/datasources/postgres.yml)
      - grafana_db_password
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - ./monitoring/grafana/public-org:/public-org:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_healthy
      grafana-db-user:
        condition: service_completed_successfully
    # Healthy only with the organization Public, so a failed setup.sh fails the deploy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health && test -f /tmp/public-org-ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Metrics of the machine. On Docker Desktop (macOS, Windows) the machine is
  # Docker's Linux VM, not the laptop. No ports, only Prometheus reads it.
  node-exporter:
    <<: [*restart, *logging]
    profiles: [host-metrics]
    image: quay.io/prometheus/node-exporter:${NODE_EXPORTER_VERSION:-v1.12.1}
    command:
      - --path.rootfs=/host
    pid: host
    volumes:
      - /:/host:ro

  # Metrics of every container on the machine. It finds the containers through
  # the Docker and containerd sockets, which Docker Desktop maps to its VM; a
  # mount of the whole /var/run would be the laptop's directory on macOS.
  cadvisor:
    <<: [*restart, *logging]
    profiles: [host-metrics]
    image: gcr.io/cadvisor/cadvisor:${CADVISOR_VERSION:-v0.55.1}
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/containerd/containerd.sock:/run/containerd/containerd.sock:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 10

  # Database of the indexer. No ports: 5432 is open from outside on the FIIT firewall.
  postgres:
    <<: [*restart, *logging]
    image: postgres:${POSTGRES_VERSION:-16}
    environment:
      POSTGRES_USER: pouw
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: pouw
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "pouw", "-d", "pouw"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Read-only user `grafana` in the indexer database (ADR-0008). Runs on every
  # start, creates or updates the user and its password, then exits.
  grafana-db-user:
    <<: *logging
    image: postgres:${POSTGRES_VERSION:-16}
    entrypoint:
      - /bin/sh
      - -c
      - |
        PGPASSWORD="$$(cat /run/secrets/postgres_password)" exec psql -h postgres -U pouw -d pouw \
          -v ON_ERROR_STOP=1 -q -v pw="$$(cat /run/secrets/grafana_db_password)" -f /grafana-reader.sql
    secrets:
      - postgres_password
      - grafana_db_password
    volumes:
      - ./monitoring/postgres/grafana-reader.sql:/grafana-reader.sql:ro
    # After the indexer is healthy, i.e. after its migrations: GRANT ON ALL
    # TABLES at the same time as CREATE TABLE of a migration can deadlock in
    # pg_class ("deadlock detected", exit 3 of this service)
    depends_on:
      postgres:
        condition: service_healthy
      indexer:
        condition: service_healthy

  # Nightly dump of the indexer database into BACKUP_DIR on the host, outside
  # the Docker volumes, kept for 7 days (scripts/backup.sh). Now: make backup.
  # Restore: scripts/restore.sh, a trial one: make restore-test
  backup:
    <<: [*restart, *logging]
    image: postgres:${POSTGRES_VERSION:-16}
    entrypoint: ["bash", "/backup.sh"]
    # bash is not PID 1, so `docker stop` ends its sleep at once
    init: true
    environment:
      BACKUP_AT: ${BACKUP_AT:-02:00}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-7}
    secrets:
      - postgres_password
    volumes:
      - ./scripts/backup.sh:/backup.sh:ro
      # A path; `make up` creates it with mode 700
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      postgres:
        condition: service_healthy
    # Healthy with a dump younger than 26 hours; the first one is made at start
    healthcheck:
      test: ["CMD-SHELL", "find /backups -maxdepth 1 -name 'pouw-*.dump' -mmin -1560 | grep -q ."]
      interval: 10s
      timeout: 5s
      start_period: 2m
      retries: 30

  # GraphQL API of the explorer over the indexer database. The image comes from
  # pouw-dashboard/hasura and applies its metadata on start; with metadata that
  # does not match the schema it does not start. The metadata tracks the views
  # in the schema api, which the indexer creates (its migrations), so Hasura
  # starts after the indexer.
  hasura:
    <<: [*restart, *logging]
    image: ghcr.io/pouw-zk/pouw-dashboard-hasura:${DASHBOARD_HASURA_VERSION:-main}
    # Hasura reads the admin secret and the database URL only from the
    # environment, so they are loaded from /run/secrets just before the start
    entrypoint:
      - /bin/sh
      - -c
      - |
        export HASURA_GRAPHQL_ADMIN_SECRET="$$(cat /run/secrets/hasura_admin_secret)"
        export PG_DATABASE_URL="postgres://pouw:$$(cat /run/secrets/postgres_password)@postgres:5432/pouw"
        export HASURA_GRAPHQL_METADATA_DATABASE_URL="$$PG_DATABASE_URL"
        exec docker-entrypoint.sh "$$HGE_BINARY" serve
    environment:
      HASURA_GRAPHQL_ENABLE_CONSOLE: "false"
      # Requests without a token (the explorer) get the read-only role of the
      # metadata. The image sets it too (pouw-dashboard#95), this covers older images.
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anonymous
    secrets:
      - postgres_password
      - hasura_admin_secret
    ports:
      - "127.0.0.1:${HASURA_PORT:-8081}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      # The indexer creates the tables and the api views that the metadata
      # tracks. Not required, so a build without an indexer image
      # (build/skip.yml) still parses; Hasura is then switched off too.
      indexer:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 5s
      start_period: 1m
      retries: 10

  # Services of the network, from GHCR (docker.yml of each repository). A new
  # service without an image yet goes into the `network` profile, so `make up`,
  # the nightly test and staging do not fail on pull; once its image exists,
  # delete its `profiles` line.

  # The chain spec of this devnet, made once for all nodes (devnet/genesis.sh)
  genesis:
    <<: *logging
    image: ghcr.io/pouw-zk/pouw-node:${NODE_VERSION:-main}
    # Writes into the new volume, which belongs to root
    user: root
    entrypoint: ["/bin/sh", "/template/genesis.sh"]
    volumes:
      - ./devnet:/template:ro
      - devnet:/devnet

  # Three miners on one chain, like Bitcoin: every node mines, gossip
  # (pouw-node#130) and the initial sync (pouw-node#128) keep them on the same
  # tip. The rewards go to test keys of the contracts
  # (pouw-docs contracts/fixtures/chain.json), so they can be spent with
  # `pouw transfer --seed`. node-1 is the bootnode.
  node-1:
    <<: *node
    environment:
      <<: *node-env
      POUW_NODE_ID: node-1
      # Reward of the blocks: the test key of the contracts (seed 32 × 0x01,
      # pouw-docs contracts/block.md), which also holds the genesis allocation
      POUW_MINER_ADDRESS: ${NODE_MINER_ADDRESS:-addr:8a88e3dd7409f195fd52db2d3cba5d72ca6709bf1d94121bf3748801b40f6f5c}
    volumes:
      - devnet:/devnet:ro
      - node-1-data:/data

  node-2:
    <<: *node
    environment:
      <<: *node-env
      POUW_NODE_ID: node-2
      POUW_BOOTNODES: ${NODE_BOOTNODES:-/dns4/node-1/tcp/30333}
      # Reward: miner-a of the contract fixtures (seed 32 × 0x0a)
      POUW_MINER_ADDRESS: ${NODE_2_MINER_ADDRESS:-addr:43a72e714401762df66b68c26dfbdf2682aaec9f2474eca4613e424a0fbafd3c}
    volumes:
      - devnet:/devnet:ro
      - node-2-data:/data

  node-3:
    <<: *node
    environment:
      <<: *node-env
      POUW_NODE_ID: node-3
      POUW_BOOTNODES: ${NODE_BOOTNODES:-/dns4/node-1/tcp/30333}
      # Reward: miner-b of the contract fixtures (seed 32 × 0x0b)
      POUW_MINER_ADDRESS: ${NODE_3_MINER_ADDRESS:-addr:66be7e332c7a453332bd9d0a7f7db055f5c5ef1a06ada66d98b39fb6810c473a}
    volumes:
      - devnet:/devnet:ro
      - node-3-data:/data

  light-node:
    <<: [*restart, *logging]
    image: ghcr.io/pouw-zk/pouw-node:${NODE_VERSION:-main}
    entrypoint: ["pouw-light-node"]
    environment:
      # The node image defines POUW_DATA_DIR for pouw-node. The light binary
      # rejects variables it does not own, so remove the inherited value.
      POUW_DATA_DIR:
      POUW_CHAIN_SPEC: /devnet/chainspec.json
      POUW_LIGHT_DATA_DIR: /data
      POUW_FULL_NODES: http://node-1:8000,http://node-2:8000,http://node-3:8000
    volumes:
      - devnet:/devnet:ro
      - light-node-data:/data
    depends_on:
      node-1:
        condition: service_healthy
      node-2:
        condition: service_healthy
      node-3:
        condition: service_healthy
    healthcheck: *health

  # Read-only workload API stub for local development.
  light-node-mock:
    <<: *logging
    profiles: [mock]
    image: wiremock/wiremock:${WIREMOCK_VERSION:-3.13.2}
    volumes:
      - ./light-node-mock/mappings:/home/wiremock/mappings:ro

  indexer:
    <<: [*restart, *logging]
    image: ghcr.io/pouw-zk/pouw-indexer:${INDEXER_VERSION:-main}
    # The indexer reads the database only from DATABASE_URL, so the URL is put
    # together from /run/secrets just before the start, as for Hasura. It runs
    # its migrations on start. Fixture blocks: make seed
    entrypoint:
      - /bin/sh
      - -c
      - |
        export DATABASE_URL="postgres://pouw:$$(cat /run/secrets/postgres_password)@postgres:5432/pouw"
        exec pouw-indexer "$$@"
      - pouw-indexer
    command: [serve]
    environment:
      # It follows the chain of node-1, the bootnode
      NODE_URL: http://node-1:8000
      # and the event log (GET /v1/events) of every node of the devnet
      EVENT_SOURCES: node-1=http://node-1:8000,node-2=http://node-2:8000,node-3=http://node-3:8000
    secrets:
      - postgres_password
    ports:
      - "127.0.0.1:${INDEXER_PORT:-8083}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      node-1:
        condition: service_healthy
    healthcheck: *health

  workload:
    <<: [*restart, *logging]
    image: ghcr.io/pouw-zk/pouw-workload:${WORKLOAD_VERSION:-main}
    environment:
      LIGHT_NODE_URL: ${LIGHT_NODE_URL:-http://light-node:8000}
      FULL_NODE_URLS: ${FULL_NODE_URLS:-http://node-1:8000,http://node-2:8000,http://node-3:8000}
    volumes:
      # reads of the real devnet: POST /api/v1/start {"scenario_name": "devnet"}
      - ./devnet/workload.yaml:/opt/pouw-workload/scenarios/devnet.yaml:ro
    depends_on:
      light-node:
        condition: service_healthy
    healthcheck: *health

  workload-soak:
    <<: *logging
    profiles: [soak]
    image: curlimages/curl:8.12.1
    restart: "no"
    entrypoint: ["/bin/sh", "/soak/run.sh"]
    volumes:
      - ./soak/run.sh:/soak/run.sh:ro
    depends_on:
      workload:
        condition: service_healthy

  # Explorer UI, nginx on port 8080 (pouw-dashboard/web). On staging the proxy
  # serves it on EXPLORER_HOST together with /v1/graphql of Hasura.
  dashboard:
    <<: [*restart, *logging]
    image: ghcr.io/pouw-zk/pouw-dashboard:${DASHBOARD_VERSION:-main}
    ports:
      - "127.0.0.1:${DASHBOARD_PORT:-8082}:8080"
    depends_on:
      hasura:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10

  jenkins:
    <<: [*restart, *logging]
    profiles: [jenkins]
    build: ./jenkins
    image: pouw-jenkins:local
    environment:
      JAVA_OPTS: -Djenkins.install.runSetupWizard=false
      # jenkins.yaml is shared, the second file sets the login (github or local)
      CASC_JENKINS_CONFIG: /var/jenkins_casc/jenkins.yaml,/var/jenkins_casc/${JENKINS_AUTH:-local}.yaml
      JENKINS_PUBLIC_URL: ${JENKINS_URL:-http://localhost:8080/}
      JENKINS_ADMINS: ${JENKINS_ADMINS:-Faustynn}
      # pouw-deploy branch for the local job (JENKINS_AUTH=local)
      JENKINS_LOCAL_BRANCH: ${JENKINS_LOCAL_BRANCH:-main}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-jenkins@localhost}
    secrets:
      - jenkins_admin_password
      - jenkins_agent_ssh_key
      - github_oauth_client_id
      - github_oauth_client_secret
      - github_app_id
      - github_app_key
      - github_webhook_secret
      - smtp_username
      - smtp_password
    volumes:
      - ./jenkins/casc:/var/jenkins_casc:ro
      - jenkins-home:/var/jenkins_home
    ports:
      - "127.0.0.1:${JENKINS_PORT:-8080}:8080"
    networks: [default, jenkins]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/login"]
      interval: 15s
      timeout: 5s
      start_period: 3m
      retries: 10

  # Agent that runs all jobs (the controller has 0 executors).
  # Docker commands from jobs go to jenkins-docker, not to the server's Docker,
  # so a job cannot reach the secrets or the network's containers.
  jenkins-agent:
    <<: [*restart, *logging]
    profiles: [jenkins]
    build:
      context: ./jenkins
      dockerfile: agent.Dockerfile
    image: pouw-jenkins-agent:local
    entrypoint: ["/bin/sh", "-c", "exec setup-sshd \"$$(cat /run/secrets/jenkins_agent_ssh_pubkey)\""]
    environment:
      DOCKER_HOST: tcp://docker:2376
      DOCKER_TLS_VERIFY: "1"
      DOCKER_CERT_PATH: /certs/client
    secrets:
      - jenkins_agent_ssh_pubkey
    volumes:
      - jenkins-docker-certs:/certs/client:ro
      - jenkins-agent-work:/home/jenkins/agent
    networks: [jenkins]
    depends_on:
      jenkins-docker:
        condition: service_healthy

  jenkins-docker:
    <<: [*restart, *logging]
    profiles: [jenkins]
    image: docker:dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: /certs
    volumes:
      - jenkins-docker-certs:/certs/client
      - jenkins-docker-data:/var/lib/docker
      - jenkins-agent-work:/home/jenkins/agent
    networks:
      jenkins:
        # The TLS certificate from docker:dind is issued for the name "docker"
        aliases: [docker]
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 10s
      timeout: 5s
      retries: 10

  proxy:
    <<: [*restart, *logging]
    profiles: [proxy]
    image: caddy:2
    environment:
      ACME_EMAIL: ${ACME_EMAIL:-admin@localhost}
      JENKINS_HOST: ${JENKINS_HOST:-jenkins.localhost}
      GRAFANA_HOST: ${GRAFANA_HOST:-grafana.localhost}
      EXPLORER_HOST: ${EXPLORER_HOST:-explorer.localhost}
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    ports:
      - "80:80"
      - "443:443"

networks:
  default:
  jenkins:

secrets:
  grafana_admin_password:
    file: ${SECRETS_DIR:-./.secrets}/grafana_admin_password
  postgres_password:
    file: ${SECRETS_DIR:-./.secrets}/postgres_password
  grafana_db_password:
    file: ${SECRETS_DIR:-./.secrets}/grafana_db_password
  hasura_admin_secret:
    file: ${SECRETS_DIR:-./.secrets}/hasura_admin_secret
  jenkins_admin_password:
    file: ${SECRETS_DIR:-./.secrets}/jenkins_admin_password
  jenkins_agent_ssh_key:
    file: ${SECRETS_DIR:-./.secrets}/jenkins_agent_ssh_key
  jenkins_agent_ssh_pubkey:
    file: ${SECRETS_DIR:-./.secrets}/jenkins_agent_ssh_key.pub
  github_oauth_client_id:
    file: ${SECRETS_DIR:-./.secrets}/github_oauth_client_id
  github_oauth_client_secret:
    file: ${SECRETS_DIR:-./.secrets}/github_oauth_client_secret
  github_app_id:
    file: ${SECRETS_DIR:-./.secrets}/github_app_id
  github_app_key:
    file: ${SECRETS_DIR:-./.secrets}/github_app_key
  github_webhook_secret:
    file: ${SECRETS_DIR:-./.secrets}/github_webhook_secret
  smtp_username:
    file: ${SECRETS_DIR:-./.secrets}/smtp_username
  smtp_password:
    file: ${SECRETS_DIR:-./.secrets}/smtp_password

volumes:
  prometheus-data:
  alertmanager-data:
